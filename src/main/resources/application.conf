appName="attachment-processor"

metastore {
    refresh_policy = "false"
}

pekko {
  loglevel = "DEBUG"
  loglevel = ${?LOG_LEVEL}
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
  logger-startup-timeout = 60s

  connectors.s3 {
    endpoint-url = ${?AWS_ENDPOINT_URL}
    access-style=path

    aws.credentials {
      provider = static
      access-key-id = ${?AWS_ACCESS_KEY_ID}
      secret-access-key = ${?AWS_SECRET_ACCESS_KEY}
    }
  }

  http {
    server {
      remote-address-header = on
    }
    host-connection-pool {
      max-connections = 32
      max-open-requests = 64
    }
  }
}

attachment-processor {
  system-params {
    maxBufferSize = 100
    maxBatchSize = 10
    closeOnEmptyReceive = false
    waitTimeSeconds = 20
    messagesPerSecond = 10
    signServiceBufferSize = 10
    esServiceBufferSize = 20
  }

  signatures {
      service-url = "http://127.0.0.1:8010"
      signing-profile = "cades-t"
;     service-url = "http://digital-signatures:8080"
;     signing-profile = "cades-t"
  }

  glacier {
    glacier-url = ${?AWS_ENDPOINT_URL}
    glacier-sns = ${?GLACIER_SNS}
  }

  elasticsearch {
    elasticsearch-url = "http://elasticsearch.nrs"
    elasticsearch-url = ${?ELASTICSEARCH}
  }

}