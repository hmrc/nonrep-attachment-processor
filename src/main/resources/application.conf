appName="attachment-processor"

metastore {
    refresh_policy = "false"
}

pekko {
  loglevel = "INFO"
  loglevel = ${?LOG_LEVEL}
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
  logger-startup-timeout = 60s

  connectors.s3 {
    path-style-access = true
    access-style = "path"
    endpoint-url = "http://localhost:9008/s3"
    aws {
      credentials {
        provider = static
        access-key-id = "access-key"
        secret-access-key = "secret-key"
      }
      region {
        provider = static
        default-region = "eu-west-2"
       }
    }
  }

  http {
    server {
      remote-address-header = on
    }
    host-connection-pool {
      max-connections = 32
      max-open-requests = 64
    }
  }
}

attachment-processor {
  system-params {
    maxBufferSize = 100
    maxBatchSize = 10
    closeOnEmptyReceive = false
    waitTimeSeconds = 20
    messagesPerSecond = 10
    signServiceBufferSize = 10
    esServiceBufferSize = 20
  }

  signatures {
    service-url = "http://digital-signatures:8080"
    signing-profile = "cades-t"
  }

  glacier {
    glacier-url = localhost
    glacier-url = ${?AWS_ENDPOINT_URL}
    glacier-sns = localhost
    glacier-sns = ${?GLACIER_SNS}
  }

  elasticsearch {
    elasticsearch-url = "http://elasticsearch.nrs"
    elasticsearch-url = ${?ELASTICSEARCH}
  }

  sqs {
    sqs-url = "http://sqs.eu-west-2.localhost.localstack.cloud:4566/000000000000/local-nonrep-attachment-queue"
    sqs-url = ${?ATTACHMENT_SQS}
    restart_policy {
        minBackoff = 1.seconds
        maxBackoff = 3.seconds
        randomFactor = 0.2 
        maxRestarts = 5
        maxRestartsDuration = 30.seconds
    }
    
  }
}